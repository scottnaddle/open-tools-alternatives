name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  # GITHUB_TOKEN 의 push/pull_request 는 이 워크플로를 시작하지 않는다.
  # 일일 검증은 gh workflow run 으로 이 이벤트를 부른다. 검사 이름은 job 이름 build-and-check.
  workflow_dispatch:

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 일일 검증 브랜치에서만 deploy-after-verifier 를 workflow_dispatch 한다.
      actions: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 피드 new 항목의 날짜는 콘텐츠 파일을 처음 넣은 커밋 시각이다.
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Astro check
        run: npm run check
      
      - name: Build
        env:
          ASTRO_BASE: /alternatives
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_NAVER_SITE_VERIFICATION: ${{ vars.PUBLIC_NAVER_SITE_VERIFICATION }}
          PUBLIC_DAUM_SITE_VERIFICATION: ${{ vars.PUBLIC_DAUM_SITE_VERIFICATION }}
        run: npm run build
      
      - name: Daily verifier non-GitHub 403 skip test
        run: python3 scripts/test_daily_verifier_host.py

      - name: Verifier auto-merge policy
        run: bash scripts/test_verifier_merge_policy.sh

      - name: Run data verification
        run: |
          if [ -f scripts/verify.py ]; then
            python3 scripts/verify.py || {
              EXIT_CODE=$?
              if [ $EXIT_CODE -eq 1 ]; then
                echo "⚠️ Data verification skipped (likely rate limit - this is expected in CI)"
                exit 0
              else
                exit $EXIT_CODE
              fi
            }
          else
            echo "Data verification script not found, skipping"
          fi
      
      - name: Check usageScope rules
        run: python3 scripts/check_usagescope.py
      
      - name: Check skill gates
        run: python3 scripts/check_skills.py
      
      - name: Check 4-axis page gates
        run: python3 scripts/check_axis_pages.py
      
      - name: Check links, orphans, raw values
        run: |
          # 빌드 후 dist/ 검사. (Site는 운영 base /alternatives/ 사용)
          python3 scripts/check_links.py
          EXIT=$?
          if [ $EXIT -ne 0 ]; then
            echo "::error::내부 링크 404, 고아 페이지(for/* 외), 원시값, 출처 중복, 자리표시 또는 예시 공개가 발견됨"
            exit $EXIT
          fi

      # 검사가 끝나야 자동 병합이 된다. 병합 대기는 이 잡 밖에서 한다.
      # PR #36 처럼 토큰이 연 pull_request CI 는 workflow_run 배포를 시작하지 않았다.
      - name: Queue deploy after verifier auto-merge
        if: success() && github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'daily-verifier/')
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          gh workflow run deploy-after-verifier.yml --ref main \
            -f "head_branch=${HEAD_BRANCH}" \
            -f "head_sha=${HEAD_SHA}"
