name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run Astro check
        run: npm run check
      
      - name: Build
        run: npm run build
      
      - name: Run data verification
        run: |
          if [ -f scripts/verify.py ]; then
            python3 scripts/verify.py
          else
            echo "Data verification script not found, skipping"
          fi
