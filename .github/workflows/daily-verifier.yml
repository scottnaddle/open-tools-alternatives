name: Daily Verifier

on:
  schedule:
    # 매일 22:00 UTC (Asia/Tashkent 03:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동 실행 허용

# contents: write — 검증 브랜치 push
# pull-requests: write — draft PR 생성
# 저장소 설정에서 'Allow GitHub Actions to create and approve pull requests'도 켜야 한다.
# (Settings > Actions > General > Workflow permissions) 꺼져 있으면 PR 단계가 실패한다.
permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install Node dependencies
        run: npm ci

      - name: Freeze guard
        run: |
          if [ -f ops/FREEZE ]; then
            echo "⛔ ops/FREEZE 존재 — 일일 검증 중단"; cat ops/FREEZE
          fi

      - name: Run daily verifier
        if: ${{ !hashFiles('ops/FREEZE') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/daily_verifier.py
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi
      
      - name: Run Astro check
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm run check
      
      - name: Run build
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm run build

      - name: Fact age report
        run: python3 scripts/fact_age.py 90 --json /tmp/fact_age_report.json || true

      - name: Create PR
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/daily_verifier_pr.sh
