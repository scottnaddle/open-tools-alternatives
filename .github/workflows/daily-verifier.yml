name: Daily Verifier

on:
  schedule:
    # 매일 22:00 UTC (Asia/Tashkent 03:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동 실행 허용

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install Node dependencies
        run: npm ci

      - name: Freeze guard
        run: |
          if [ -f ops/FREEZE ]; then
            echo "⛔ ops/FREEZE 존재 — 일일 검증 중단"; cat ops/FREEZE
          fi

      - name: Run daily verifier
        if: ${{ !hashFiles('ops/FREEZE') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/daily_verifier.py
      
      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
          fi
      
      - name: Run Astro check
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm run check
      
      - name: Run build
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm run build

      - name: Fact age report
        run: python3 scripts/fact_age.py 90 --json /tmp/fact_age_report.json || true

      - name: Create PR
        if: steps.check_changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 브랜치명 생성
          DATE=$(date +%Y%m%d)
          BRANCH="daily-verifier/${DATE}"
          
          # Git 설정
          git config user.name "Daily Verifier Bot"
          git config user.email "bot@yeollin-dogu.dev"
          
          # 브랜치 생성 및 커밋
          git checkout -b "$BRANCH"
          git add src/content/tools/ src/content/skills/ src/content/changes/
          git commit -m "chore: daily verification update ${DATE}

          A-grade changes (stars, releases, health) are ready to merge.
          C-grade changes (license) need 24h recheck before marking ready.
          
          See /tmp/daily_verifier_summary.json for details."
          
          git push origin "$BRANCH"
          
          # PR 생성 (draft로 시작)
          gh pr create \
            --title "🔄 Daily Verification — ${DATE}" \
            --body "## Daily Verification Results

          This PR contains automated verification updates from the GitHub/GitLab APIs.

          ### Changes Classification

          - **A-grade changes** (stars, latest release, lastPush, health active/slowing): Ready to merge immediately
          - **C-grade changes** (license, health stale/archived): Need 24h recheck and matching results before marking ready

          ### Review Instructions

          1. Check A-grade changes — these can be merged now
          2. For C-grade changes:
             - If status is \`pending-24h\`: Wait 24 hours, then re-run the workflow
             - If status is \`approved\`: Ready to merge (24h recheck passed)
          3. Mark PR ready when all C-grade changes are approved OR remove pending C-grade changes

          ### Notes

          - This workflow **never commits directly to main**
          - C-grade changes are proposed but not applied until 24h recheck confirms
          - Review the change records in \`src/content/changes/\` for sources

          ---
          *Generated by Daily Verifier workflow*" \
            --base main \
            --head "$BRANCH" \
            --draft
