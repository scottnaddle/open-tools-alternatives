name: Deploy after verifier merge

# GITHUB_TOKEN 으로 병합하면 main push 가 다른 워크플로를 시작하지 않는다.
# 사람이 연 pull_request CI 가 성공하면 workflow_run 으로 온다.
# 봇이 gh workflow run 으로 돌린 CI(workflow_dispatch)도 같다.
# 그 경우 workflow_run 이 안 따라올 수 있어(PR #36) CI가 이 워크플로를 직접 부르기도 한다.
# 이 파일은 기본 브랜치에 있을 때만 workflow_run 으로 동작한다.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      head_branch:
        description: '일일 검증 브랜치 (daily-verifier/…)'
        required: true
        type: string
      head_sha:
        description: '검사를 통과한 커밋'
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  wait:
    timeout-minutes: 15
    # push CI 는 제외한다. 브랜치 push 와 pull_request 가 둘 다 성공하면 배포가 두 번 간다.
    # workflow_dispatch 는 봇이 붙인 build-and-check 이다.
    if: >-
      (
        github.event_name == 'workflow_dispatch' &&
        startsWith(inputs.head_branch, 'daily-verifier/')
      ) || (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'workflow_dispatch') &&
        startsWith(github.event.workflow_run.head_branch, 'daily-verifier/')
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    outputs:
      merged: ${{ steps.poll.outputs.merged }}
      sha: ${{ steps.poll.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Wait until verifier PR is merged
        id: poll
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD: ${{ github.event_name == 'workflow_dispatch' && inputs.head_branch || github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.head_sha || github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event_name == 'workflow_dispatch' && 'workflow_dispatch' || github.event.workflow_run.event }}
        run: bash scripts/deploy_verifier_followup.sh "$HEAD" "$HEAD_SHA" "$EVENT"

  deploy:
    needs: wait
    if: needs.wait.outputs.merged == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.wait.outputs.sha }}
    secrets: inherit
