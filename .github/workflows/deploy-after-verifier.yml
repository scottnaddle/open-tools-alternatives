name: Deploy after verifier merge

# GITHUB_TOKEN 으로 병합하면 main push 가 다른 워크플로를 시작하지 않는다.
# CI 가 daily-verifier/* 에서 성공하고, 라벨 agent/verifier PR 이 병합되면 deploy 를 호출한다.
# 이 파일은 기본 브랜치에 있을 때만 workflow_run 으로 동작한다.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  wait:
    timeout-minutes: 15
    # pull_request 만 본다. GITHUB_TOKEN 의 브랜치 push 는 CI를 시작하지 않고,
    # push 와 pull_request 가 둘 다 성공하면 배포가 두 번 호출된다.
    # 일일 검증 PR #30 의 CI 이벤트는 pull_request 였다.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'daily-verifier/')
    runs-on: ubuntu-latest
    outputs:
      merged: ${{ steps.poll.outputs.merged }}
      sha: ${{ steps.poll.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Wait until verifier PR is merged
        id: poll
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bash scripts/deploy_verifier_followup.sh "$HEAD" "$HEAD_SHA"

  deploy:
    needs: wait
    if: needs.wait.outputs.merged == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.wait.outputs.sha }}
    secrets: inherit
