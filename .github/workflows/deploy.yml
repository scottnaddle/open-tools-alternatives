name: Deploy

# push: 사람이 병합한 main (GITHUB_TOKEN 병합은 push 워크플로를 시작하지 않는다).
# workflow_dispatch: 수동. workflow_call: 일일 검증 병합 직후(deploy-after-verifier.yml).
# DEPLOY_SSH_KEY 가 없으면 비밀번호로 가지 않고 안내 후 성공으로 끝낸다.
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "배포할 커밋. 비우면 이 실행의 SHA"
        required: false
        type: string
        default: ""
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "astro.config.mjs"
      - "integrations/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "scripts/deploy.sh"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_call' && inputs.ref != '' && inputs.ref || github.sha }}

      - name: Freeze guard
        id: freeze
        run: |
          if [ -f ops/FREEZE ]; then
            echo "⛔ ops/FREEZE 존재 — 배포 중단"; cat ops/FREEZE; exit 1
          fi

      - name: Require deploy SSH key
        id: gate
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::notice title=배포 키 없음::DEPLOY_SSH_KEY 시크릿이 없습니다. 배포를 건너뜁니다. 비밀번호로는 접속하지 않습니다. ops/DEPLOY_KEY_SETUP.md 를 따라 설정한 뒤 다시 실행하세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.gate.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      - name: Build
        if: steps.gate.outputs.ready == 'true'
        env:
          ASTRO_BASE: /alternatives
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_NAVER_SITE_VERIFICATION: ${{ vars.PUBLIC_NAVER_SITE_VERIFICATION }}
          PUBLIC_DAUM_SITE_VERIFICATION: ${{ vars.PUBLIC_DAUM_SITE_VERIFICATION }}
        run: npm run build

      - name: Deploy
        id: ship
        if: steps.gate.outputs.ready == 'true'
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SKIP_BUILD: '1'
        run: bash scripts/deploy.sh

      - name: Result
        if: always()
        run: |
          if [ "${{ steps.freeze.outcome }}" = "failure" ]; then
            echo "ops/FREEZE 로 배포가 중단되었습니다."
            exit 1
          fi
          if [ "${{ steps.gate.outputs.ready }}" != "true" ]; then
            echo "배포를 건너뛰었습니다. ops/DEPLOY_KEY_SETUP.md"
            exit 0
          fi
          if [ "${{ steps.ship.outcome }}" != "success" ]; then
            echo "배포가 실패했습니다. 헬스체크 실패면 스크립트가 백업으로 되돌립니다. ops/RUNBOOK.md 3절."
            exit 1
          fi
          echo "배포 단계를 마쳤습니다."
